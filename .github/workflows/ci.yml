# Runs on every push and pull request. Uses the same Task shortcuts we use locally.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Verify Task
        run: task --version

      - name: Build
        run: task build

      - name: Test
        run: task test

  database:
    name: Database starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v2

      # CI has no real .env, so use the example file (fake password, never a real one)
      - name: Make .env from the example
        run: cp .env.example .env

      - name: Start Postgres
        run: task up

      - name: Wait until Postgres is ready
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T ccos-db pg_isready -U ccos-db && exit 0
            sleep 2
          done
          echo "Postgres never got ready"; docker compose logs ccos-db; exit 1

      - name: Stop Postgres
        if: always()
        run: task down
