# CCOS local Postgres. Values come from the .env file in this same folder.
# Works with Docker (docker compose up -d) or Podman (podman compose up -d).
services:
  ccos-db:
    image: docker.io/library/postgres:16 # full name so Podman doesn't ask which registry
    container_name: ccos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ccos-data:/var/lib/postgresql/data # keeps your data when the container stops

volumes:
  ccos-data:
